# Vertex configuration. true = vanilla behavior, false = skip for performance.
# Edits apply in-game within about a second; no restart needed.

# Render the sky pass (sky color, stars, sun and moon)
sky=true

# Render clouds
clouds=true

# Render rain and snow, and spawn rain splash particles
weather=true

# Spawn void fog depth particles
voidParticles=true

# Animate block textures (water, lava, fire, portals)
textureAnimations=true

# Render distance fog (lava, water and blindness fog always stay)
fog=true

# Rebuild the chunk section you just edited ahead of the update queue
interactiveRenderPriority=true

# Dynamic light sources illuminate surroundings (needs the source collector)
dynamicLights=true

# Log a Vertex activity summary once per minute
diagnostics=false

