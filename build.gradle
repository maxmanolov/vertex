plugins {
    id 'java'
}

group = 'vertex'
version = '0.4.0'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// -source/-target alone still compile against the running JDK's class library, so a
// JDK 9+ build emits covariant NIO descriptors (e.g. IntBuffer.clear()Ljava/nio/IntBuffer;)
// that crash the game's Java 8 runtime with NoSuchMethodError. --release compiles
// against the real Java 8 API; a JDK 8 compiler needs (and accepts) no flag.
tasks.withType(JavaCompile).configureEach {
    if (JavaVersion.current().isJava9Compatible()) {
        options.release = 8
    }
}

repositories {
    maven { url = 'https://libraries.minecraft.net' }
    mavenCentral()
}

sourceSets {
    benchmark {
        java.srcDir 'src/benchmark/java'
    }
    benchmarkTest {
        java.srcDir 'src/benchmarkTest/java'
        compileClasspath += sourceSets.benchmark.output
        runtimeClasspath += sourceSets.benchmark.output
    }
}

configurations {
    benchmarkTestImplementation.extendsFrom benchmarkImplementation
    benchmarkTestRuntimeOnly.extendsFrom benchmarkRuntimeOnly
}

dependencies {
    // LaunchWrapper is Mojang's own tweaker loader; provided by the launcher profile at runtime.
    implementation 'net.minecraft:launchwrapper:1.12'
    // Matches the gson version vanilla 1.7.10 ships, so the shaded copy cannot conflict.
    implementation 'com.google.code.gson:gson:2.2.4'
    // Present on the game classpath at runtime; needed only to compile the fog hook.
    compileOnly 'org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209'
    testImplementation 'junit:junit:4.13.2'
    benchmarkImplementation 'com.google.code.gson:gson:2.2.4'
    benchmarkImplementation 'net.minecraft:launchwrapper:1.12'
    benchmarkImplementation 'org.ow2.asm:asm-debug-all:5.0.3'
    benchmarkTestImplementation 'junit:junit:4.13.2'
}

jar {
    // ASM and gson are shaded so the launcher profile only needs launchwrapper + this jar.
    // LaunchClassLoader excludes org.objectweb.asm from transformation, so an unrelocated
    // copy on the game classpath is safe in a vanilla profile.
    from({
        configurations.runtimeClasspath.filter {
            it.name.contains('asm-debug-all') || it.name.contains('gson')
        }.collect { zipTree(it) }
    }) {
        exclude 'META-INF/**'
    }

    manifest {
        attributes(
            'Main-Class': 'vertex.installer.VertexInstaller',
            'Implementation-Title': 'Vertex',
            'Implementation-Version': project.version
        )
    }
}

test {
    useJUnit()
    testLogging { events 'failed', 'skipped' }
}

tasks.register('benchmarkTest', Test) {
    description = 'Runs the local benchmark harness tests.'
    group = 'verification'
    testClassesDirs = sourceSets.benchmarkTest.output.classesDirs
    classpath = sourceSets.benchmarkTest.runtimeClasspath
    useJUnit()
    testLogging { events 'failed', 'skipped' }
}

tasks.register('benchmarkJar', Jar) {
    description = 'Builds the standalone local benchmark harness.'
    group = 'build'
    archiveBaseName = 'vertex-benchmark'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.benchmark.output
    from {
        configurations.benchmarkRuntimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    manifest {
        attributes('Main-Class': 'vertex.benchmark.BenchmarkMain')
    }
}

tasks.register('benchmarkDist', Zip) {
    description = 'Builds the Windows drag-and-drop benchmark package.'
    group = 'distribution'
    dependsOn tasks.named('benchmarkJar')
    archiveBaseName = 'vertex-benchmark'
    archiveClassifier = 'windows'

    from(tasks.named('benchmarkJar')) {
        rename { 'vertex-benchmark.jar' }
    }
    from('bench/benchmark.cmd')
    from('bench/README-QUICK.txt') {
        rename { 'README.txt' }
    }
}

check.dependsOn tasks.named('benchmarkTest')
