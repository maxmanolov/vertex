name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Java 8)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: vertex
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  # The installer carries Windows- and macOS-specific launcher path logic; these legs run
  # the same build+tests on those platforms. Kept as a separate job so the required status
  # check on main ("Build and test (Java 8)") keeps its exact context name.
  cross-platform:
    name: Build and test (Java 8, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            distribution: temurin
          # macos-latest is an arm64 runner and Temurin publishes no arm64 macOS JDK 8;
          # Zulu does (same distribution the arm64 dev machine runs).
          - os: macos-latest
            distribution: zulu

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --no-daemon
